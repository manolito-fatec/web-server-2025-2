services:
  db:
    image: postgres:17
    container_name: postgres_db_service
    networks:
      - pardal-network
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5


  mongo:
    image: mongo:8
    container_name: mongo_audit_service
    networks:
      - pardal-network
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5


  etl-service:
    build:
      context: ./etl-python
    networks:
      - pardal-network
    restart: 'unless-stopped'
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./dump:/app/dump
      - ./etl-python/data:/app/output/insights_data
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy

    command: /bin/bash -c "./config/restore_db.sh && python -u main.py"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

volumes:
  mongo-data:

networks:
  pardal-network:
    driver: bridge