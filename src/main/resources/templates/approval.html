<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <img th:src="@{cid:logo}" alt="Logo" style="width: 150px; height: auto;">
    <h1>🎉 Cadastro Aprovado na Plataforma Pardal!</h1>

    <p>

    <p>Boas-vindas!</p>
</body>
</html>
