spring.application.name=pardal

spring.datasource.url=jdbc:postgresql://localhost:5432/BANCO_POPULADO_V2
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate = true
spring.flyway.baseline-version = 1
spring.flyway.default-schema = pardal
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql=trace

spring.data.mongodb.uri=mongodb://mongoadmin:secret@localhost:27017/insights_db?authSource=admin
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=manolito.pardal@gmail.com
spring.mail.password=ppib asja wkbm yttl
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.test-connection=true

spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.token=root-token
spring.cloud.vault.scheme=http
# KV (Key-Value) Engine
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=${spring.application.name}

# Importar configurações do Vault
spring.config.import=vault://
