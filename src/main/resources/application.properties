spring.application.name=pardal

spring.datasource.url=jdbc:postgresql://localhost:5432/BANCO_POPULADO_V2
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate = true
spring.flyway.baseline-version = 1
spring.flyway.default-schema = pardal
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql=trace

spring.data.mongodb.uri=mongodb://mongoadmin:secret@localhost:27017/insights_db?authSource=admin