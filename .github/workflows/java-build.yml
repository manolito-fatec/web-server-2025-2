name: Java Build with Maven

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{secrets.DB_NAME}}
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" --health-interval 10s --health-timeout 5s --health-retries 5

      postgres-dek:
        image: postgres:17
        env:
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{secrets.DB_NAME}}
        ports:
          - 3159:5432
        options: --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" --health-interval 10s --health-timeout 5s --health-retries 5

      vault:
        image: hashicorp/vault:1.15.6
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
          VAULT_ADDR: http://127.0.0.1:8200
        options: --cap-add IPC_LOCK --health-cmd "vault status" --health-interval 5s --health-timeout 3s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Vault CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gpg
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install vault

      - name: Initialize Vault
        env:
          VAULT_ADDR: http://localhost:8200
          VAULT_TOKEN: root-token
        run: |
          echo 'Aguardando Vault (step)...';
          sleep 5; # Apenas uma garantia extra após a healthcheck
          
          echo 'Habilitando Transit Engine...';
          vault secrets enable transit || echo 'Transit já habilitado';
          
          echo 'Criando chave de criptografia user-encryption-key...';
          vault write -f transit/keys/user-encryption-key || echo 'Chave já existe';
          
          echo 'Configurando políticas de acesso...';
          vault policy write transit-policy - <<EOF
          path "transit/encrypt/user-encryption-key" {
            capabilities = ["update"]
          }
          path "transit/decrypt/user-encryption-key" {
            capabilities = ["update"]
          }
          EOF
          echo 'Vault configurado com sucesso!';


      - name: Build with Maven
        run: mvn -B clean package -DskipTests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{secrets.DB_NAME}}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect

          DEK_DATASOURCE_URL: jdbc:postgresql://localhost:3159/${{secrets.DB_NAME}}
          DEK_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
          DEK_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}

          VAULT_ADDR: http://localhost:8200
          VAULT_TOKEN: root-token